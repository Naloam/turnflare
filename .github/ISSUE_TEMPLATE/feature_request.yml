name: Feature request
description: Describe a workflow Turnflare should make easier.
title: '[Feature]: '
body:
  - type: textarea
    id: workflow
    attributes:
      label: What are you trying to do?
      description: Describe the task and where the current workflow falls short.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What result would help?
      description: An example input and desired output is especially useful.
    validations:
      required: true
